    <!-- FontAwesome Icons -->

                <!-- Search Bar -->

    <!-- Edit Record Modal -->

            <div class="flex justify-between items-center border-b border-slate-800 pb-3">

                <div>

                    <input type="date" id="edit-entryDate" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-xs uppercase text-slate-400 mb-1">Circle Dispatch No. *</label>
                    <input type="text" id="edit-circleDispatchNo" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-xs uppercase text-slate-400 mb-1">Zonal Diary No. *</label>
                    <input type="text" id="edit-zonalDiaryNo" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-amber-500">
                </div>
                <div class="sm:col-span-2">
                    <label class="block text-xs uppercase text-slate-400 mb-1">Order Description *</label>
                    <input type="text" id="edit-orderDescription" required placeholder="e.g. ROC, closure, etc." class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-xs uppercase text-slate-400 mb-1">Court Name *</label>
                    <input type="text" id="edit-courtName" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-xs uppercase text-slate-400 mb-1">FIR / WP No *</label>
                    <input type="text" id="edit-firNo" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-amber-500">
                </div>
                <div class="sm:col-span-2">
                    <label class="block text-xs uppercase text-slate-400 mb-1">Case Title *</label>
                    <input type="text" id="edit-caseTitle" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-xs uppercase text-slate-400 mb-1">Hearing Date *</label>
                    <input type="date" id="edit-hearingDate" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-xs uppercase text-slate-400 mb-1">Priority *</label>
                    <select id="edit-priority" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-amber-500">
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                    </select>
                </div>
                <div class="sm:col-span-2">
                    <label class="block text-xs uppercase text-slate-400 mb-1">Status *</label>
                    <select id="edit-status" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-amber-500">

    <!-- PDF Viewer Modal -->
    <div id="pdf-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex flex-col items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-4xl h-[85vh] flex flex-col overflow-hidden shadow-2xl">
            <div class="p-4 border-b border-slate-800 flex justify-between items-center">
                <h3 id="pdf-modal-title" class="font-bold text-slate-100 flex items-center gap-2">
                    <i class="fa-solid fa-file-pdf text-rose-500"></i> Attached Document
                </h3>
                <button onclick="closePdfModal()" class="text-slate-400 hover:text-white p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div class="flex-1 bg-slate-950">
                <iframe id="pdf-frame" class="w-full h-full border-none"></iframe>
            </div>
        </div>
    </div>

    <script>
        // CONFIGURATION: JSONBin details
        const BIN_ID = '6ac609cfac6210605a1bb8ba';
        const MASTER_KEY = '$2a$10$QTuP9XykW5O1zJHSGye5/uYGk0nusyhgu5/lYYFiTb8B6gitTGv12';

        // CONFIGURATION: Cloudinary details for PDF storage
        const CLOUDINARY_CLOUD_NAME = 'xb1vr0t7'; 
        const CLOUDINARY_UPLOAD_PRESET = 'xb1vr0t7'; 

        const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
        let records = [];
        let targetRecordIdForPdf = null;

        window.onload = fetchRecords;

        // Play a very high-pitched, loud warning beep using Web Audio API
        function playHighBeep() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();

                // Play 3 rapid loud beeps
                for (let i = 0; i < 3; i++) {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();

                    osc.type = 'square'; // Harsh wave for a loud alarm sound
                    osc.frequency.setValueAtTime(1200, ctx.currentTime + (i * 0.25)); // High pitch (1200 Hz)

                    gain.gain.setValueAtTime(0.3, ctx.currentTime + (i * 0.25)); // Loud volume
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + (i * 0.25) + 0.18);

                    osc.connect(gain);
                    gain.connect(ctx.destination);

                    osc.start(ctx.currentTime + (i * 0.25));
                    osc.stop(ctx.currentTime + (i * 0.25) + 0.18);
                }
            } catch (e) {
                console.log("Audio alert blocked or unsupported:", e);
            }
        }

        // READ: Fetch all records from cloud JSON bin
        async function fetchRecords() {
            try {
                const res = await fetch(`${API_URL}/latest`, {
                    headers: { 'X-Master-Key': MASTER_KEY }
                });
                const data = await res.json();
                records = Array.isArray(data.record) ? data.record : [];
                reindexRecords();
                renderTable();
                checkUpcomingHearings();
            } catch (err) {
                alert('Error fetching data from JSONBin. Please check credentials.');
            }
        }

        // Check for hearings scheduled within the next 2 days (48 hours) using local time parsing
        function checkUpcomingHearings() {
            const container = document.getElementById('alert-banner-container');
            container.innerHTML = '';

            if (!records || records.length === 0) return;

            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();

            const twoDaysLater = new Date(today);
            twoDaysLater.setDate(twoDaysLater.getDate() + 2);
            const limitTime = twoDaysLater.getTime();

            const upcoming = records.filter(r => {
                if (!r.hearingDate || r.status === 'Concluded') return false;
                
                const parts = r.hearingDate.split('-');
                if (parts.length !== 3) return false;
                const hTime = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2])).getTime();

                return hTime >= today && hTime <= limitTime;
            });

            if (upcoming.length === 0) return;

            // Trigger high-pitched audio warning beep
            playHighBeep();

            const alertsHTML = upcoming.map(r => `
                <div class="bg-amber-500/10 border border-amber-500/30 text-amber-200 px-4 py-3 rounded-2xl flex items-start sm:items-center justify-between gap-3 shadow-lg">
                    <div class="flex items-center gap-3">
                        <div class="p-2 bg-amber-500 text-slate-950 rounded-xl font-bold animate-bounce">
                            <i class="fa-solid fa-triangle-exclamation"></i>
                        </div>
                        <div>
                            <span class="font-bold uppercase text-xs text-amber-400 block tracking-wider">Upcoming Hearing Alert (Within 2 Days)</span>
                            <span class="text-sm font-semibold text-white">${r.caseTitle} (FIR/WP: ${r.firNo})</span>
                            <span class="text-xs text-slate-300 block">Court: ${r.courtName} | Hearing Date: <strong class="text-amber-300">${r.hearingDate}</strong></span>
                        </div>
                    </div>
                    <button onclick="this.parentElement.remove()" class="text-amber-400 hover:text-white p-1">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            `).join('');

            container.innerHTML = `<div class="space-y-3">${alertsHTML}</div>`;
        }

        // Upload PDF directly to Cloudinary using /raw/upload endpoint to support locked/protected files[cite: 1]
        async function uploadPdfToCloudinary(file) {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);

            const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/raw/upload`, {
                method: 'POST',
                body: formData
            });

            if (!res.ok) {
                throw new Error('Failed to upload PDF to Cloudinary');
            }

            const data = await res.json();
            return data.secure_url;
        }

        // SAVE: Add record and update JSONBin
        async function handleFormSubmit(e) {
            e.preventDefault();
            const btn = document.getElementById('save-btn');
            btn.disabled = true;
            btn.innerText = 'Saving Record...';

            const newRecord = {
                id: 'REC-' + Date.now(),
                diaryNo: document.getElementById('diaryNo').value,
                entryDate: document.getElementById('entryDate').value,
                circleDispatchNo: document.getElementById('circleDispatchNo').value,
                zonalDiaryNo: document.getElementById('zonalDiaryNo').value,
                orderDescription: document.getElementById('orderDescription').value,
                courtName: document.getElementById('courtName').value,
                firNo: document.getElementById('firNo').value,
                caseTitle: document.getElementById('caseTitle').value,
                hearingDate: document.getElementById('hearingDate').value,
                priority: document.getElementById('priority').value,
                status: document.getElementById('status').value,
                pdfUrl: null,
                pdfName: null
            };

            records.push(newRecord);
            await syncToCloud();

            document.getElementById('record-form').reset();
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> Save Permanently';
        }

        // Trigger dynamic file input for uploading PDF to specific record
        function triggerPdfUpload(id) {
            targetRecordIdForPdf = id;
            document.getElementById('dynamicPdfInput').click();
        }

        // Handle PDF upload from existing record row action
        async function handleDynamicPdfUpload(event) {
            const file = event.target.files[0];
            if (!file || !targetRecordIdForPdf) return;

            if (file.type !== "application/pdf") {
                alert("Please select a valid PDF file.");
                event.target.value = '';
                return;
            }

            try {
                const pdfUrl = await uploadPdfToCloudinary(file);
                const record = records.find(r => String(r.id) === String(targetRecordIdForPdf));
                if (record) {
                    record.pdfUrl = pdfUrl;
                    record.pdfName = file.name;
                    await syncToCloud();
                }
            } catch (err) {
                alert("Failed to upload PDF. Please check credentials.");
            } finally {
                event.target.value = '';
                targetRecordIdForPdf = null;
            }
        }

        // Open Edit Modal with current record details
        function editRecord(id) {
            const record = records.find(r => String(r.id) === String(id));
            if (!record) return;

            document.getElementById('edit-id').value = record.id;
            document.getElementById('edit-diaryNo').value = record.diaryNo || '';
            document.getElementById('edit-entryDate').value = record.entryDate || '';
            document.getElementById('edit-circleDispatchNo').value = record.circleDispatchNo || '';
            document.getElementById('edit-zonalDiaryNo').value = record.zonalDiaryNo || '';
            document.getElementById('edit-orderDescription').value = record.orderDescription || '';
            document.getElementById('edit-courtName').value = record.courtName || '';
            document.getElementById('edit-firNo').value = record.firNo || '';
            document.getElementById('edit-caseTitle').value = record.caseTitle || '';
            document.getElementById('edit-hearingDate').value = record.hearingDate || '';
            document.getElementById('edit-priority').value = record.priority || 'Medium';
            document.getElementById('edit-status').value = record.status || 'Scheduled';

            document.getElementById('edit-modal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('edit-modal').classList.add('hidden');
        }

        // Save Edit Form changes
        async function handleEditFormSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('edit-id').value;
            const record = records.find(r => String(r.id) === String(id));
            if (!record) return;

            const btn = document.getElementById('edit-save-btn');
            btn.disabled = true;
            btn.innerText = 'Updating...';

            record.diaryNo = document.getElementById('edit-diaryNo').value;
            record.entryDate = document.getElementById('edit-entryDate').value;
            record.circleDispatchNo = document.getElementById('edit-circleDispatchNo').value;
            record.zonalDiaryNo = document.getElementById('edit-zonalDiaryNo').value;
            record.orderDescription = document.getElementById('edit-orderDescription').value;
            record.courtName = document.getElementById('edit-courtName').value;
            record.firNo = document.getElementById('edit-firNo').value;
            record.caseTitle = document.getElementById('edit-caseTitle').value;
            record.hearingDate = document.getElementById('edit-hearingDate').value;
            record.priority = document.getElementById('edit-priority').value;
            record.status = document.getElementById('edit-status').value;

            await syncToCloud();
            closeEditModal();

            btn.disabled = false;
            btn.innerText = 'Update Record';
        }

        // DELETE: Remove record by ID and re-index
        async function deleteRecord(id) {
            if (confirm('Are you sure you want to delete this record?')) {
                records = records.filter(r => String(r.id) !== String(id));
                await syncToCloud();
            }
        }

        // UPDATE: Send updated array back to JSONBin via PUT request
        async function syncToCloud() {
            reindexRecords();
            renderTable();
            checkUpcomingHearings();
            try {
                await fetch(API_URL, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': MASTER_KEY
                    },
                    body: JSON.stringify(records)
                });
            } catch (err) {
                alert('Failed to sync changes with cloud storage.');
            }
        }

        function reindexRecords() {
            records.forEach((r, idx) => r.srNo = String(idx + 1));
        }

        // Search Filter
        function filterRecords() {
            renderTable();
        }

        // EXPORT: Convert current array into downloadable ali.xlsx file
        function exportToExcel() {
            if (records.length === 0) {
                alert('No records to export!');
                return;
            }

            const exportData = records.map(r => ({
                "Sr No": r.srNo,
                "Diary No": r.diaryNo,
                "Entry Date": r.entryDate,
                "Circle Dispatch No": r.circleDispatchNo || '',
                "Zonal Diary No": r.zonalDiaryNo || '',
                "Order Description": r.orderDescription || '',
                "Court Name": r.courtName,
                "FIR/WP No": r.firNo,
                "Case Title": r.caseTitle,
                "Hearing Date": r.hearingDate,
                "Priority": r.priority,
                "Status": r.status,
                "PDF Link": r.pdfUrl || "No Attachment"
            }));

            const worksheet = XLSX.utils.json_to_sheet(exportData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, 'Court Records');
            XLSX.writeFile(workbook, "ali.xlsx");
        }

        // Open PDF Preview Modal
        function viewPdf(id) {
            const record = records.find(r => String(r.id) === String(id));
            if (record && record.pdfUrl) {
                document.getElementById('pdf-modal-title').innerText = record.pdfName || "Attached Document";
                document.getElementById('pdf-frame').src = record.pdfUrl;
                document.getElementById('pdf-modal').classList.remove('hidden');
            }
        }

        function closePdfModal() {
            document.getElementById('pdf-modal').classList.add('hidden');
            document.getElementById('pdf-frame').src = "";
        }

        // Render rows dynamically
        function renderTable() {
            const query = (document.getElementById('searchInput')?.value || '').toLowerCase().trim();
            const displayRecords = [...records].reverse();

            const filteredRecords = displayRecords.filter(r => {
                if (!query) return true;
                return (
                    (r.srNo && r.srNo.toLowerCase().includes(query)) ||
                    (r.diaryNo && r.diaryNo.toLowerCase().includes(query)) ||
                    (r.circleDispatchNo && r.circleDispatchNo.toLowerCase().includes(query)) ||
                    (r.zonalDiaryNo && r.zonalDiaryNo.toLowerCase().includes(query)) ||
                    (r.orderDescription && r.orderDescription.toLowerCase().includes(query)) ||
                    (r.courtName && r.courtName.toLowerCase().includes(query)) ||
                    (r.firNo && r.firNo.toLowerCase().includes(query)) ||
                    (r.caseTitle && r.caseTitle.toLowerCase().includes(query)) ||
                    (r.priority && r.priority.toLowerCase().includes(query)) ||
                    (r.status && r.status.toLowerCase().includes(query))
                );
            });

            document.getElementById('record-count').innerText = `${filteredRecords.length} / ${records.length} Records`;
            const tbody = document.getElementById('records-tbody');

            if (filteredRecords.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9" class="py-6 text-center text-slate-500">No records found.</td></tr>`;
                return;
            }

            tbody.innerHTML = filteredRecords.map(r => `
                <tr class="hover:bg-slate-800/50">
                    <td class="py-3 px-4">
                        <span class="font-bold text-white">Sr: ${r.srNo}</span>
                        <span class="block text-xs text-amber-500 font-mono">Diary: ${r.diaryNo || '-'}</span>
                        <span class="block text-[11px] text-slate-400">Disp: ${r.circleDispatchNo || '-'}</span>
                        <span class="block text-[11px] text-slate-400">Zonal: ${r.zonalDiaryNo || '-'}</span>
                    </td>
                    <td class="py-3 px-4 text-slate-300">${r.orderDescription || '-'}</td>
                    <td class="py-3 px-4">${r.courtName}</td>
                    <td class="py-3 px-4 font-mono">${r.firNo}</td>
                    <td class="py-3 px-4 font-semibold text-white">${r.caseTitle}</td>
                    <td class="py-3 px-4">${r.hearingDate || '-'}</td>
                    <td class="py-3 px-4">${r.priority}</td>
                    <td class="py-3 px-4">
                        ${r.pdfUrl ? `
                            <button onclick="viewPdf('${r.id}')" class="px-2 py-1 bg-amber-500/10 text-amber-400 hover:bg-amber-500/20 rounded-lg border border-amber-500/20 text-xs flex items-center gap-1">
                                <i class="fa-solid fa-file-pdf text-rose-400"></i> View PDF
                            </button>
                        ` : `<span class="text-slate-600 text-xs">None</span>`}
                    </td>
                    <td class="py-3 px-4 text-right">
                        <div class="flex items-center justify-end gap-1.5">
                            <button onclick="editRecord('${r.id}')" title="Edit Record" class="px-2 py-1 bg-sky-500/10 text-sky-400 hover:bg-sky-500/20 rounded-lg border border-sky-500/20 text-xs">
                                <i class="fa-solid fa-pen-to-square"></i> Edit
                            </button>
                            <button onclick="triggerPdfUpload('${r.id}')" title="Upload PDF" class="px-2 py-1 bg-emerald-500/10 text-emerald-400 hover:bg-emerald-500/20 rounded-lg border border-emerald-500/20 text-xs">
                                <i class="fa-solid fa-file-arrow-up"></i> Upload PDF
                            </button>
                            <button onclick="deleteRecord('${r.id}')" title="Delete Record" class="px-2 py-1 bg-rose-500/10 text-rose-400 hover:bg-rose-500/20 rounded-lg border border-rose-500/20 text-xs">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }
    </script>
</body>
</html>
